<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#c9c3af"
  >

  <title>
    Crisis in Gordistan
  </title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

  <div id="map"></div>


  <!-- GAME BAR -->

  <header
    id="topbar"
    class="hidden"
  >

    <button
      id="gameMenuBtn"
      class="boardButton"
    >
      ☰
    </button>

    <div id="turnMini">

      <strong id="turnLabel">
        Crisis in Gordistan
      </strong>

      <span id="yourSide"></span>

    </div>

    <button
      id="playersButton"
      class="boardButton"
    >
      Players
    </button>

  </header>


  <!-- MAIN MENU -->

  <main id="menuScreen">

    <section class="menuCard">

      <h1>
        CRISIS
        <span>IN GORDISTAN</span>
      </h1>

      <p class="subtitle">
        A political-military hex game
      </p>

      <label>
        Commander
      </label>

      <input
        id="menuName"
        maxlength="24"
        placeholder="Your name"
      >

      <button
        id="createBtn"
        class="primary full"
      >
        Create Game
      </button>

      <div class="joinRow">

        <input
          id="joinCode"
          maxlength="6"
          placeholder="ROOM CODE"
        >

        <button id="joinRoomBtn">
          Join
        </button>

      </div>


      <section class="menuSection">

        <div class="sectionHeader">

          <strong>
            Available Games
          </strong>

          <button
            id="refreshMenuBtn"
            class="textButton"
          >
            Refresh
          </button>

        </div>

        <div id="joinableGames"></div>

      </section>


      <section class="menuSection">

        <strong>
          Games in Progress
        </strong>

        <div id="currentGames"></div>

      </section>


      <details class="menuSection">

        <summary>
          Finished Games
        </summary>

        <div id="finishedGames"></div>

      </details>

    </section>

  </main>


  <!-- LOBBY -->

  <section
    id="lobby"
    class="paperPanel hidden"
  >

    <div class="panelHeader">

      <div>

        <strong>
          COMMAND ASSIGNMENT
        </strong>

        <small id="roomTag"></small>

      </div>

      <button id="leaveLobbyBtn">
        Leave
      </button>

    </div>


    <label>
      Commander
    </label>

    <input
      id="playerName"
      maxlength="24"
    >


    <label>
      Side
    </label>

    <select id="seat">

      <option value="0">
        Coalition
      </option>

      <option value="1">
        Iran
      </option>

      <option value="2">
        Regional States
      </option>

      <option value="3">
        Nonstate Forces
      </option>

    </select>


    <button
      id="takeSeatBtn"
      class="primary full"
    >
      Take Command
    </button>


    <div id="lobbyStatus"></div>

    <div id="lobbyPlayers"></div>


    <button
      id="startBtn"
      class="primary full"
    >
      Begin Game
    </button>

  </section>


  <!-- GAME MENU -->

  <section
    id="gameMenu"
    class="sidePanel hidden"
  >

    <div class="panelHeader">

      <strong>
        GAME MENU
      </strong>

      <button id="closeGameMenu">
        ×
      </button>

    </div>

    <div
      id="roomCodeInMenu"
      class="smallText"
    ></div>

    <button
      id="exitGameBtn"
      class="full"
    >
      Exit to Main Menu
    </button>

    <button
      id="finishGameBtn"
      class="full danger"
    >
      End Game
    </button>

  </section>


  <!-- PLAYERS -->

  <section
    id="playersDrawer"
    class="sidePanel hidden"
  >

    <div class="panelHeader">

      <strong>
        TURN ORDER
      </strong>

      <button id="closePlayers">
        ×
      </button>

    </div>

    <div id="playerList"></div>

    <div id="trackList"></div>

  </section>


  <!-- STACK INSPECTOR -->

  <section
    id="stackPanel"
    class="stackPanel hidden"
  >

    <div class="panelHeader">

      <div>

        <strong>
          HEX STACK
        </strong>

        <small id="stackHex"></small>

      </div>

      <button id="closeStack">
        ×
      </button>

    </div>

    <div id="stackContents"></div>

  </section>


  <!-- SELECTED UNIT -->

  <section
    id="unitPanel"
    class="bottomPanel hidden"
  >

    <div id="selectedUnit"></div>

    <button id="clearSelection">
      Close
    </button>

  </section>


  <button
    id="logButton"
    class="floatingLog hidden"
  >
    Log
  </button>


  <button
    id="endTurnBtn"
    class="endTurn hidden"
  >
    End Turn
  </button>


  <section
    id="logDrawer"
    class="logPanel hidden"
  >

    <div class="panelHeader">

      <strong>
        GAME RECORD
      </strong>

      <button id="closeLog">
        ×
      </button>

    </div>

    <div id="log"></div>

  </section>


  <div
    id="loading"
    class="loading hidden"
  >

    <div class="spinner"></div>

    <div id="loadingText">
      Loading…
    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script src="/app.js"></script>

</body>

</html>
