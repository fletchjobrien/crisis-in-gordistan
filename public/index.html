<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crisis in Gordistan</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <h1>Crisis in Gordistan</h1>
      <p>Minimal hex-and-counter crisis wargame</p>
    </div>
    <div id="roomTag"></div>
  </header>

  <main>
    <section class="panel" id="lobby">
      <h2>Online game</h2>
      <div class="row">
        <button id="createBtn">Create game</button>
        <input id="joinCode" maxlength="6" placeholder="ROOM CODE">
        <button id="joinRoomBtn">Open room</button>
      </div>

      <div id="seatBox" class="hidden">
        <input id="playerName" maxlength="24" placeholder="Your name">
        <select id="seat">
          <option value="0">Coalition</option>
          <option value="1">Iran</option>
          <option value="2">Regional States</option>
          <option value="3">Nonstate / Political</option>
        </select>
        <button id="takeSeatBtn">Take seat</button>
        <button id="startBtn">Start game</button>
      </div>
      <div id="players"></div>
    </section>

    <section id="game" class="hidden">
      <div class="toolbar panel">
        <div><b id="turnLabel">Turn</b></div>
        <div class="tracks" id="tracks"></div>
        <button id="endTurnBtn">End turn</button>
      </div>

      <div class="gameLayout">
        <div class="panel boardWrap">
          <div id="board"></div>
        </div>
        <aside class="panel">
          <h3>Selected</h3>
          <div id="selected">None</div>
          <button id="cancelBtn">Cancel</button>
          <h3>Game log</h3>
          <div id="log"></div>
        </aside>
      </div>
    </section>

    <footer>
      This prototype deliberately uses fictional geography and abstract force values rather than real bases,
      invasion corridors, targeting data, or real-world orders of battle.
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
